<!DOCTYPE html>
<html lang="en">

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Diabi - Advanced Diabetes Prediction</title>
    <link rel="stylesheet" href="{{ url_for('static', filename='css/style.css') }}">
    <link href="https://fonts.googleapis.com/css2?family=Outfit:wght@300;400;500;600;700&display=swap" rel="stylesheet">
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.0.0/css/all.min.css">
</head>

<body>
    <div class="main-container">
        <!-- Decoration Circles -->
        <div class="circle circle-1"></div>
        <div class="circle circle-2"></div>

        <div class="glass-card">
            <header>
                <div class="logo">
                    <i class="fa-solid fa-heart-pulse"></i>
                    <h1>Diabi</h1>
                </div>
                <p>Advanced AI-Powered Diabetes Risk Assessment</p>
            </header>

            <form id="predictionForm">
                <div class="form-grid">
                    <!-- Personal Info -->
                    <div class="input-group">
                        <label>Gender</label>
                        <select name="gender" required>
                            <option value="" disabled selected>Select Gender</option>
                            <option value="Male">Male</option>
                            <option value="Female">Female</option>
                            <option value="Other">Other</option>
                        </select>
                    </div>

                    <div class="input-group">
                        <label>Age</label>
                        <input type="number" name="age" placeholder="e.g., 45" min="1" max="120" required>
                    </div>

                    <div class="input-group">
                        <label>BMI <a href="#" id="openBmiCalc"
                                style="font-size: 0.8em; color: var(--primary-color); margin-left: 10px;"><i
                                    class="fa-solid fa-calculator"></i> Calculate</a></label>
                        <input type="number" id="bmiInput" name="bmi" placeholder="e.g., 24.5" step="0.1" min="10"
                            max="100" required>
                    </div>

                    <!-- BMI Calculator Modal -->
                    <div id="bmiModal" class="modal hidden">
                        <div class="modal-content glass-card"
                            style="max-width: 450px; margin: 10% auto; padding: 30px;">
                            <span class="close-modal">&times;</span>
                            <h3 style="margin-bottom: 25px; color: var(--primary-color);">Calculate BMI</h3>

                            <!-- Height Section -->
                            <div class="input-group" style="margin-bottom: 20px;">
                                <div
                                    style="display: flex; justify-content: space-between; align-items: center; margin-bottom: 8px;">
                                    <label style="margin-bottom: 0;">Height</label>
                                    <div class="unit-selector">
                                        <span class="unit-option active" data-type="height" data-unit="cm">cm</span>
                                        <span class="unit-option" data-type="height" data-unit="ft">ft+in</span>
                                    </div>
                                </div>

                                <!-- CM Input -->
                                <div id="heightInputCm">
                                    <input type="number" id="h_cm" placeholder="e.g. 175" class="hybrid-input">
                                </div>

                                <!-- FT+IN Input -->
                                <div id="heightInputFt" class="hidden" style="display: flex; gap: 10px;">
                                    <input type="number" id="h_ft" placeholder="ft" class="hybrid-input"
                                        style="flex: 1;">
                                    <input type="number" id="h_in" placeholder="in" class="hybrid-input"
                                        style="flex: 1;">
                                </div>
                            </div>

                            <!-- Weight Section -->
                            <div class="input-group">
                                <div
                                    style="display: flex; justify-content: space-between; align-items: center; margin-bottom: 8px;">
                                    <label style="margin-bottom: 0;">Weight</label>
                                    <div class="unit-selector">
                                        <span class="unit-option active" data-type="weight" data-unit="kg">kg</span>
                                        <span class="unit-option" data-type="weight" data-unit="lbs">lbs</span>
                                    </div>
                                </div>
                                <input type="number" id="w_val" placeholder="e.g. 70" class="hybrid-input">
                            </div>

                            <div class="bmi-result-preview hidden" id="bmiPreview">
                                BMI: <span id="previewValue">--</span>
                            </div>

                            <button type="button" id="calcBmiBtn" style="width: 100%; margin-top: 20px;">Calculate &
                                Apply</button>
                        </div>
                    </div>
                    <!-- Health History -->
                    <div class="input-group">
                        <label>Hypertension</label>
                        <select name="hypertension" required>
                            <option value="0">No</option>
                            <option value="1">Yes</option>
                        </select>
                    </div>

                    <div class="input-group">
                        <label>Heart Disease</label>
                        <select name="heart_disease" required>
                            <option value="0">No</option>
                            <option value="1">Yes</option>
                        </select>
                    </div>

                    <!-- New Research-Grade Features -->
                    <div class="input-group">
                        <label>Waist Circumference (cm)</label>
                        <input type="number" name="waist_circumference" placeholder="e.g. 85" step="0.1" required>
                    </div>

                    <div class="input-group">
                        <label>Sedentary Hours (per day)</label>
                        <input type="number" name="sedentary_hours" placeholder="e.g. 8" step="0.5" min="0" max="24"
                            required>
                    </div>

                    <div class="input-group">
                        <label>Sugary Drinks (per week)</label>
                        <input type="number" name="sugary_drinks" placeholder="e.g. 3" min="0" max="50" required>
                    </div>

                    <div class="input-group">
                        <label>Processed Food (times/week)</label>
                        <input type="number" name="processed_food" placeholder="e.g. 5" min="0" max="50" required>
                    </div>

                    <div class="input-group">
                        <label>Fruit/Veg Intake (times/week)</label>
                        <input type="number" name="fruit_veg" placeholder="e.g. 10" min="0" max="50" required>
                    </div>

                    <!-- Family History (Added during training) -->
                    <div class="input-group">
                        <label>Family History of Diabetes</label>
                        <select name="family_history" required>
                            <option value="0">No</option>
                            <option value="1">Yes</option>
                        </select>
                    </div>

                    <!-- New Risk Factors -->


                    <div class="input-group">
                        <label>Diet Habit</label>
                        <select name="diet" required>
                            <option value="Unhealthy">Unhealthy</option>
                            <option value="Mixed">Mixed</option>
                            <option value="Healthy">Healthy</option>
                        </select>
                    </div>

                    <div class="input-group">
                        <label>Physical Activity</label>
                        <select name="physical_activity" required>
                            <option value="Sedentary">Sedentary</option>
                            <option value="Moderately Active">Moderately Active</option>
                            <option value="Active">Active</option>
                        </select>
                    </div>
                </div>

                <button type="submit" id="predictBtn">
                    <span>Analyze Risk</span>
                    <i class="fa-solid fa-arrow-right"></i>
                </button>
            </form>


        </div>
    </div>

    <!-- Result Modal / Overlay (Moved to root) -->
    <div id="resultContainer" class="result-container hidden">
        <div class="result-content">
            <div id="resultIcon" class="result-icon"></div>
            <h2 id="resultTitle">Analyzing...</h2>
            <div class="probability-meter">
                <div class="meter-bg">
                    <div id="meterFill" class="meter-fill"></div>
                </div>
                <p id="probabilityText">0% Risk Probability</p>
            </div>

            <div id="riskFactors" class="risk-factors">
                <!-- Impact factors injected here -->
            </div>
            <button id="resetBtn" class="secondary-btn">New Assessment</button>
        </div>
    </div>

    <script src="{{ url_for('static', filename='js/script.js') }}"></script>
</body>

</html>
